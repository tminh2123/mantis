<div class="container">
  <p class="eyebrow">Text-Guided Medical Image Segmentation</p>
  <h1>MedLangViT — Double U-Shape with ECSAM Skip Connections</h1>
  <div class="diagram-wrapper">
  <!--
    DownCNN shifted down 1 level so InConv aligns with DownViT₁:
      InConv=L1, DownCNN₁=L2, DownCNN₂=L3, DownCNN₃=L4, DownCNN₄=BN, Bottleneck=L5(new)
    This makes DownCNN_i perfectly align with DownViT_{i+1} → all horizontal connections, no elbows.

    X layout: Text:20-140 | DownCNN:160-270 |50px| DownViT:320-430 |40px|
              UpViT:470-580 |40px| Recon:620-710 |40px| ECSAM:750-830 | ⊕:850 | UpCNN:870-980

    <title id="t">MedLangViT Architecture</title>
    <desc id="d">Double U-Shape with ECSAM skip connections.</desc>

      <marker id="arr-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#800080"/></marker>
