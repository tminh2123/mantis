<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRIS Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f5;
      font-family: 'Geist', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }
    .container {
      max-width: 1000px;
      width: 100%;
    }
    .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #5a6580;
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 1.75rem;
      font-weight: 400;
      color: #2d3142;
      margin-bottom: 32px;
    }
    .diagram-wrapper {
      overflow-x: auto;
    }
    svg {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="eyebrow">Model Architecture</p>
    <h1>IRIS: Text-Guided Medical Image Segmentation</h1>
    
    <div class="diagram-wrapper">
      <svg width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="iris-title iris-desc">
        <title id="iris-title">IRIS Architecture</title>
        <desc id="iris-desc">Two-stage architecture with visual encoder, text encoder, BCAM fusion modules, and U-Net style decoder with deep supervision.</desc>
        
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M1,1 L7,4 L1,7" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M1,1 L7,4 L1,7" fill="none" stroke="#bf4520" stroke-width="1.2"/>
          </marker>
        </defs>
        
        <!-- Background -->
        <rect width="960" height="680" fill="#f5f5f5"/>
        
        <!-- ==================== ZONES ==================== -->
        
        <!-- Visual Encoder Zone -->
        <rect x="20" y="40" width="200" height="520" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="60" y="44" width="120" height="14" rx="2" fill="#f5f5f5"/>
        <text x="120" y="54" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VISUAL ENCODER</text>
        
        <!-- Text Encoder Zone -->
        <rect x="240" y="40" width="160" height="200" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="275" y="44" width="90" height="14" rx="2" fill="#f5f5f5"/>
        <text x="320" y="54" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TEXT ENCODER</text>
        
        <!-- Fusion Zone -->
        <rect x="420" y="40" width="140" height="520" rx="8" fill="rgba(191,69,32,0.04)" stroke="rgba(191,69,32,0.20)" stroke-width="0.8"/>
        <rect x="455" y="44" width="70" height="14" rx="2" fill="#f5f5f5"/>
        <text x="490" y="54" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">FUSION</text>
        
        <!-- Decoder Zone -->
        <rect x="580" y="40" width="200" height="520" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="650" y="44" width="60" height="14" rx="2" fill="#f5f5f5"/>
        <text x="680" y="54" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DECODER</text>
        
        <!-- Output Zone -->
        <rect x="800" y="40" width="140" height="520" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="815" y="44" width="110" height="14" rx="2" fill="#f5f5f5"/>
        <text x="870" y="54" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DEEP SUPERVISION</text>
        
        <!-- ==================== ARROWS (drawn before nodes) ==================== -->
        
        <!-- Input Image to Down0 -->
        <line x1="120" y1="100" x2="120" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Down blocks vertical connections -->
        <line x1="120" y1="176" x2="120" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="120" y1="252" x2="120" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="120" y1="328" x2="120" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="120" y1="404" x2="120" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Text Input to CLIP -->
        <line x1="320" y1="100" x2="320" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- CLIP to Token Emb -->
        <line x1="320" y1="176" x2="320" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Visual to Fusion connections (horizontal) -->
        <path d="M180,152 H404 Q412,152 412,160 V196 Q412,204 420,204" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M180,228 H404 Q412,228 412,236 V272 Q412,280 420,280" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M180,304 H404 Q412,304 412,312 V348 Q412,356 420,356" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M180,380 H404 Q412,380 412,388 V424 Q412,432 420,432" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        
        <!-- Text to all Fusion modules -->
        <path d="M380,152 H404 Q412,152 412,160 V196 Q412,204 420,204" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M380,180 H388 Q396,180 396,188 V272 Q396,280 404,280 H420" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M380,208 H388 Q396,208 396,216 V348 Q396,356 404,356 H420" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M380,228 H388 Q396,228 396,236 V424 Q396,432 404,432 H420" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        
        <!-- Fusion to Decoder (main path - accent) -->
        <line x1="560" y1="204" x2="588" y2="204" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="560" y1="280" x2="588" y2="280" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="560" y1="356" x2="588" y2="356" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="560" y1="432" x2="588" y2="432" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        
        <!-- Decoder vertical connections (upward) -->
        <line x1="680" y1="428" x2="680" y2="364" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="680" y1="352" x2="680" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="680" y1="276" x2="680" y2="212" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="680" y1="200" x2="680" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Skip connections (visual to decoder) -->
        <path d="M180,456 H200 Q208,456 208,448 V80 Q208,72 216,72 H564 Q572,72 572,80 V120 Q572,128 580,128" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <rect x="376" y="68" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="394" y="77" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">SKIP</text>
        
        <!-- Decoder to Output heads -->
        <line x1="740" y1="128" x2="808" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="740" y1="204" x2="808" y2="204" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="740" y1="280" x2="808" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="740" y1="356" x2="808" y2="356" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="740" y1="432" x2="808" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- Output to Prediction -->
        <line x1="870" y1="176" x2="870" y2="500" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        
        <!-- ==================== NODES ==================== -->
        
        <!-- Input Image -->
        <rect x="60" y="72" width="120" height="28" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="120" y="90" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Input Image</text>
        
        <!-- Down0 -->
        <rect x="60" y="128" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="120" y="148" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Down0</text>
        <text x="120" y="164" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">64ch, 224×224</text>
        
        <!-- Down1 -->
        <rect x="60" y="204" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="120" y="224" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Down1</text>
        <text x="120" y="240" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">128ch, 112×112</text>
        
        <!-- Down2 -->
        <rect x="60" y="280" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="120" y="300" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Down2</text>
        <text x="120" y="316" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">256ch, 56×56</text>
        
        <!-- Down3 -->
        <rect x="60" y="356" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="120" y="376" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Down3</text>
        <text x="120" y="392" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">512ch, 28×28</text>
        
        <!-- Down4 (Bottleneck) -->
        <rect x="60" y="432" width="120" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="120" y="452" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Down4</text>
        <text x="120" y="468" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">512ch, 14×14</text>
        
        <!-- Text Input -->
        <rect x="260" y="72" width="120" height="28" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="320" y="90" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Text Prompt</text>
        
        <!-- CLIP Encoder -->
        <rect x="260" y="128" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="320" y="148" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">CLIP Text</text>
        <text x="320" y="164" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">frozen</text>
        
        <!-- Token Embeddings -->
        <rect x="260" y="204" width="120" height="28" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="320" y="222" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Token Emb</text>
        
        <!-- BCAM Fusion Modules (Focal) -->
        <rect x="440" y="180" width="100" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="490" y="200" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">BCAM 1</text>
        <text x="490" y="216" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">112×112</text>
        
        <rect x="440" y="256" width="100" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="490" y="276" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">BCAM 2</text>
        <text x="490" y="292" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">56×56</text>
        
        <rect x="440" y="332" width="100" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="490" y="352" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">BCAM 3</text>
        <text x="490" y="368" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">28×28</text>
        
        <rect x="440" y="408" width="100" height="48" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="490" y="428" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">BCAM 4</text>
        <text x="490" y="444" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">14×14</text>
        
        <!-- Decoder Up Blocks -->
        <rect x="620" y="104" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="124" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Up0</text>
        <text x="680" y="140" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">64ch, 224×224</text>
        
        <rect x="620" y="180" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="200" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Up1</text>
        <text x="680" y="216" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">64ch, 112×112</text>
        
        <rect x="620" y="256" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="276" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Up2</text>
        <text x="680" y="292" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">128ch, 56×56</text>
        
        <rect x="620" y="332" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="680" y="352" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Up3</text>
        <text x="680" y="368" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">256ch, 28×28</text>
        
        <rect x="620" y="408" width="120" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="680" y="428" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">PixLevel + Up</text>
        <text x="680" y="444" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">512ch, 14×14</text>
        
        <!-- Deep Supervision Outputs -->
        <rect x="820" y="104" width="100" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="870" y="124" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Out0</text>
        <text x="870" y="140" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Main Output</text>
        
        <rect x="820" y="180" width="100" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="870" y="200" fill="#5a6580" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Out1</text>
        <text x="870" y="216" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">aux 112×112</text>
        
        <rect x="820" y="256" width="100" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="870" y="276" fill="#5a6580" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Out2</text>
        <text x="870" y="292" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">aux 56×56</text>
        
        <rect x="820" y="332" width="100" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="870" y="352" fill="#5a6580" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Out3</text>
        <text x="870" y="368" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">aux 28×28</text>
        
        <rect x="820" y="408" width="100" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="870" y="428" fill="#5a6580" font-size="11" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Out4</text>
        <text x="870" y="444" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">aux 14×14</text>
        
        <!-- Final Prediction -->
        <rect x="820" y="508" width="100" height="40" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="870" y="532" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Prediction</text>
        
        <!-- ==================== LEGEND ==================== -->
        <rect x="20" y="580" width="920" height="80" rx="0" fill="#f5f5f5"/>
        <line x1="20" y1="580" x2="940" y2="580" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        
        <text x="40" y="605" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        
        <!-- Legend items -->
        <rect x="40" y="620" width="24" height="16" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="72" y="632" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Focal (BCAM Fusion)</text>
        
        <rect x="200" y="620" width="24" height="16" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="632" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Processing Block</text>
        
        <rect x="380" y="620" width="24" height="16" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="412" y="632" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Bottleneck / Store</text>
        
        <rect x="560" y="620" width="24" height="16" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
        <text x="592" y="632" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Auxiliary Output</text>
        
        <line x1="740" y1="628" x2="770" y2="628" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="780" y="632" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Text-guided flow</text>
        
        <line x1="880" y1="628" x2="910" y2="628" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="918" y="632" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Skip</text>
        
      </svg>
    </div>
  </div>
</body>
</html>
