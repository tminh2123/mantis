# IRIS Configuration - QaTa-COV19 Dataset with MedKLIP Backbone

project:
  name: iris-medklip
  dataset: qata
  seed: 922

data:
  root: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg"
  train_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/train"
  val_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/val"
  test_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/test"
  image_size: 224
  num_workers: 4

model:
  # Backbone selection: "clip" (default) or "medklip"
  backbone: "medklip"
  
  # MedKLIP-specific settings
  medklip_visual_path: "medklip_checkpoints/MedKLIP/checkpoint_final.pth"  # Path to MedKLIP pretrained checkpoint
  medklip_text_model: "microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext"
  freeze_medklip_visual: false  # True to freeze ResNet50 visual encoder
  freeze_medklip_text: true     # True to freeze BioBERT text encoder (recommended)
  use_entity_translation: true  # Convert disease names to descriptions
  
  # Common settings
  max_token_len: 77
  base_channel: 64
  num_heads: 8
  dropout: 0.5
  expansion: 4
  deep_supervision: true
  num_classes: 1
  text_mask_rate: 0.3
  img_mask_rate: 0.3
  
  # CLIP-specific (ignored when backbone=medklip)
  clip_model: "openai/clip-vit-base-patch32"
  frozen_clip: true
  encoder_type: "cnn"

pretrain:
  enabled: false  # Not needed - MedKLIP is already pretrained
  epochs: 100
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-4
  temperature: 0.07
  eps: 0.8

train:
  epochs: 300
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  bce_weight: 0.5
  grad_clip: 1.0
  cosine_lr: true
  loss_weights: [0.5, 0.2, 0.15, 0.1, 0.05]
  asymmetric_weights:
    - [0.5, 0.5]
    - [0.4, 0.6]
    - [0.3, 0.7]
    - [0.2, 0.8]
    - [0.1, 0.9]
  early_stopping: true
  es_patience: 20

eval:
  threshold: 0.5

logging:
  save_every: 10
