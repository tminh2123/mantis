# IRIS Ablation: Full CNN encoder, NO Pretrain
# Experiment: baseline_cnn_nopretrain

project:
  name: iris
  seed: 922
  exp_name: iris_qata_cnn_nopretrain

data:
  root: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg"
  train_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/train"
  val_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/val"
  test_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/test"
  image_size: 224
  num_workers: 4

model:
  clip_model: "openai/clip-vit-base-patch32"
  base_channel: 64
  num_heads: 8
  expansion: 4
  encoder_type: "cnn"  # Full CNN encoder
  max_token_len: 18
  dropout: 0.5
  text_mask_rate: 0.3
  img_mask_rate: 0.3
  frozen_clip: true
  deep_supervision: true
  num_classes: 1

pretrain:
  enabled: false  # NO pretrain
  epochs: 100
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-4
  temperature: 0.07
  eps: 0.8
  checkpoint: "output/checkpoints/iris_qata_cnn_nopretrain_pretrain.pth"

train:
  epochs: 300
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  bce_weight: 0.5
  grad_clip: 1.0
  cosine_lr: true
  loss_weights: [0.5, 0.2, 0.15, 0.1, 0.05]
  asymmetric_weights:
    - [0.5, 0.5]
    - [0.4, 0.6]
    - [0.3, 0.7]
    - [0.2, 0.8]
    - [0.1, 0.9]
  early_stopping: true
  es_patience: 10
  save_after: 50

eval:
  batch_size: 16
  threshold: 0.5
  checkpoint: "output/checkpoints/iris_qata_cnn_nopretrain_best.pth"

logging:
  log_dir: "output/logs/iris_qata_cnn_nopretrain"
  checkpoint_dir: "output/checkpoints"
  save_every: 10
