# IRIS Configuration - MosMedData+ Dataset
#
# Default: CNN visual + CLIP text + BCAM fusion
# Use CLI args to override for ablation studies

project:
  name: iris
  dataset: mosmed
  seed: 922

data:
  root: "../../../dataset/MosMedDataPlus"
  train_dir: "../../../dataset/MosMedDataPlus/Train_Folder"
  val_dir: "../../../dataset/MosMedDataPlus/Val_Folder"
  test_dir: "../../../dataset/MosMedDataPlus/Test_Folder"
  image_size: 224
  num_workers: 4

model:
  # Visual encoder: "cnn" (default) or "resnet" (MedKLIP)
  visual_encoder: "cnn"
  
  # Text encoder: "clip" (default), "clinicalbert", "pubmedbert"
  text_encoder: "clip"
  clip_model: "openai/clip-vit-base-patch32"
  
  # Fusion: "bcam" (default) or "bifmd"
  fusion_type: "bcam"
  
  # Model architecture
  max_token_len: 18
  frozen_clip: true
  base_channel: 64
  num_heads: 8
  dropout: 0.5
  expansion: 4
  encoder_type: "cnn"
  deep_supervision: true
  num_classes: 1

train:
  epochs: 300
  batch_size: 32
  lr: 3.0e-4  # Lower LR for MosMed
  weight_decay: 1.0e-4
  visual_lr_scale: 0.1
  bce_weight: 0.5
  grad_clip: 1.0
  cosine_lr: true
  loss_weights: [0.5, 0.2, 0.15, 0.1, 0.05]
  asymmetric_weights:
    - [0.5, 0.5]
    - [0.4, 0.6]
    - [0.3, 0.7]
    - [0.2, 0.8]
    - [0.1, 0.9]
  early_stopping: true
  es_patience: 20

eval:
  threshold: 0.5

logging:
  save_every: 10
