# IRIS Configuration - MosMedData+ Dataset

project:
  name: iris
  dataset: mosmed
  seed: 922

data:
  train_dir: "../../../dataset/MosMedDataPlus/Train_Folder"
  val_dir: "../../../dataset/MosMedDataPlus/Val_Folder"
  test_dir: "../../../dataset/MosMedDataPlus/Test_Folder"
  image_size: 224
  num_workers: 4

model:
  visual_encoder: "cnn"
  text_encoder: "clip"
  fusion: "bcam"
  base_channel: 64
  num_heads: 8
  expansion: 4
  dropout: 0.5
  max_token_len: 18
  deep_supervision: true

train:
  epochs: 300
  batch_size: 32
  lr: 3.0e-4  # Lower LR for MosMed
  weight_decay: 1.0e-4
  visual_lr_scale: 0.1
  bce_weight: 0.5
  grad_clip: 1.0
  loss_weights: [0.5, 0.2, 0.15, 0.1, 0.05]
  patience: 20
