# IRIS Ablation Native Configuration - QaTa-COV19 Dataset
# Uses native ResNet50 channels without adapters

project:
  name: iris
  dataset: qata
  seed: 922

data:
  root: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg"
  train_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/train"
  val_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/val"
  test_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/test"
  image_size: 224
  num_workers: 4

model:
  # Ablation native backbone - no channel adapters
  backbone: "ablation_native"
  
  # Visual encoder: "cnn" (ImageNet ResNet50) or "medklip" (MedKLIP ResNet50)
  visual_encoder: "medklip"
  medklip_visual_path: "medklip_checkpoints/MedKLIP/checkpoint_final.pth"
  freeze_visual: false
  
  # Text encoder: "clip" (CLIP ViT) or "medklip" (PubMedBERT)
  text_encoder: "clip"
  clip_model: "openai/clip-vit-base-patch32"
  medklip_text_model: "microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext"
  freeze_text: true
  
  # Fusion type: "bcam" or "bifmd"
  fusion_type: "bcam"
  
  # Model architecture
  max_token_len: 18
  num_heads: 8
  dropout: 0.5
  expansion: 4
  deep_supervision: true
  num_classes: 1
  text_mask_rate: 0.3
  img_mask_rate: 0.3

pretrain:
  enabled: true
  epochs: 100
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-4
  temperature: 0.07
  eps: 0.8

train:
  epochs: 300
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  bce_weight: 0.5
  grad_clip: 1.0
  cosine_lr: true
  # Native decoder has 4 levels: 1024->512->256->64
  loss_weights: [0.55, 0.25, 0.15, 0.05]
  asymmetric_weights:
    - [0.5, 0.5]
    - [0.4, 0.6]
    - [0.3, 0.7]
    - [0.2, 0.8]
  early_stopping: true
  es_patience: 20

eval:
  threshold: 0.5

logging:
  save_every: 10
