# IRIS Ablation Configuration - QaTa-COV19 Dataset
# 
# Ablation study configurations:
#   Encoders:
#     1. visual=cnn, text=clip       -> IRIS baseline (original)
#     2. visual=cnn, text=medklip    -> IRIS + MedKLIP text encoder
#     3. visual=medklip, text=clip   -> MedKLIP visual + CLIP text
#     4. visual=medklip, text=medklip -> Full MedKLIP
#   
#   Fusion:
#     - fusion_type=bcam  -> Original BCAM fusion
#     - fusion_type=bifmd -> BiFMD fusion (FiLM-modulated)
#
# Usage examples:
#   # Baseline (CNN + CLIP + BCAM)
#   python run.py --config configs/qata_ablation.yaml --tag ablation_baseline --mode train
#
#   # MedKLIP text only
#   python run.py --config configs/qata_ablation.yaml --tag ablation_text_only \
#     --visual_encoder cnn --text_encoder medklip --mode train
#
#   # MedKLIP visual only
#   python run.py --config configs/qata_ablation.yaml --tag ablation_visual_only \
#     --visual_encoder medklip --text_encoder clip --mode train
#
#   # Full MedKLIP
#   python run.py --config configs/qata_ablation.yaml --tag ablation_both \
#     --visual_encoder medklip --text_encoder medklip --mode train
#
#   # BiFMD fusion
#   python run.py --config configs/qata_ablation.yaml --tag ablation_bifmd \
#     --fusion_type bifmd --mode train

project:
  name: iris-ablation
  dataset: qata
  seed: 922

data:
  root: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg"
  train_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/train"
  val_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/val"
  test_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/test"
  image_size: 224
  num_workers: 4

model:
  # Backbone selection: "clip" | "medklip" | "ablation"
  backbone: "ablation"
  
  # Encoder selection (only for backbone=ablation)
  visual_encoder: "cnn"     # "cnn" (IRIS original) | "medklip" (ResNet50)
  text_encoder: "clip"      # "clip" (IRIS original) | "medklip" (PubMedBERT)
  
  # Fusion selection (only for backbone=ablation)
  fusion_type: "bcam"       # "bcam" (IRIS original) | "bifmd" (BiFMD fusion)
  
  # CLIP settings (for text_encoder=clip)
  clip_model: "openai/clip-vit-base-patch32"
  
  # MedKLIP settings (for visual_encoder=medklip or text_encoder=medklip)
  medklip_visual_path: "medklip_checkpoints/MedKLIP/checkpoint_final.pth"
  medklip_text_model: "microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext"
  freeze_medklip_visual: false
  freeze_medklip_text: true
  use_entity_translation: true  # Only applies when text_encoder=medklip
  
  # Common settings
  max_token_len: 77
  base_channel: 64
  num_heads: 8
  dropout: 0.5
  expansion: 4
  deep_supervision: true
  num_classes: 1
  text_mask_rate: 0.3
  img_mask_rate: 0.3
  
  # For IRIS original (ignored in ablation mode)
  frozen_clip: true
  encoder_type: "cnn"

pretrain:
  enabled: false  # Not needed when using pretrained encoders
  epochs: 100
  batch_size: 64
  lr: 1.0e-3
  weight_decay: 1.0e-4
  temperature: 0.07
  eps: 0.8

train:
  epochs: 300
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  bce_weight: 0.5
  grad_clip: 1.0
  cosine_lr: true
  loss_weights: [0.5, 0.2, 0.15, 0.1, 0.05]
  asymmetric_weights:
    - [0.5, 0.5]
    - [0.4, 0.6]
    - [0.3, 0.7]
    - [0.2, 0.8]
    - [0.1, 0.9]
  early_stopping: true
  es_patience: 20

eval:
  threshold: 0.5

logging:
  save_every: 10
