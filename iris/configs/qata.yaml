# IRIS Configuration - QaTa-COV19 Dataset
#
# Examples:
#   python run.py --config configs/qata.yaml --tag baseline
#   python run.py --config configs/qata.yaml --tag best \
#     --visual resnet --pretrained path/to/medklip.pth \
#     --text clinicalbert --fusion bifmd --num_heads 8 --expansion 4

project:
  name: iris
  dataset: qata
  seed: 922

data:
  train_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/train"
  val_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/val"
  test_dir: "../../../dataset/QaTa-COV19/QaTa-COV19-v2/c2seg/test"
  image_size: 224
  num_workers: 4

model:
  visual_encoder: "cnn"
  text_encoder: "clip"
  fusion: "bcam"
  base_channel: 64
  num_heads: 8
  expansion: 4
  dropout: 0.5
  max_token_len: 18
  deep_supervision: true

train:
  epochs: 300
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  visual_lr_scale: 0.1
  bce_weight: 0.5
  grad_clip: 1.0
  loss_weights: [0.5, 0.2, 0.15, 0.1, 0.05]
  patience: 20
