# C2Seg Configuration - MosMedData+ Dataset

project:
  name: c2seg
  seed: 922

data:
  root: "../../../dataset/MosMedData+/c2seg"
  train_dir: "../../../dataset/MosMedData+/c2seg/train"
  val_dir: "../../../dataset/MosMedData+/c2seg/val"
  test_dir: "../../../dataset/MosMedData+/c2seg/test"
  image_size: 224
  num_workers: 4

model:
  clip_model: "ViT-B/32"
  base_channel: 64
  kan_grid_size: 5  # KAN B-spline grid intervals (c2seg-origin default)
  kan_spline_order: 3  # KAN B-spline order (cubic, c2seg-origin default)
  max_token_len: 18
  dropout: 0.5
  text_mask_rate: 0.3
  img_mask_rate: 0.3
  mask_mode: "dist"
  pool_mode: "max_pool"
  frozen_clip: true

pretrain:
  epochs: 100
  batch_size: 256
  lr: 1.0e-4  # Lower LR for MosMedData+
  weight_decay: 1.0e-4
  temperature: 0.07
  eps: 0.8
  checkpoint: "output/checkpoints/c2seg_pretrain.pth"

train:
  epochs: 500
  batch_size: 32
  lr: 1.0e-4  # Lower LR for MosMedData+
  weight_decay: 1.0e-4
  bce_weight: 0.5
  grad_clip: 1.0
  cosine_lr: true  # Use CosineAnnealingWarmRestarts like c2seg-origin
  # Deep supervision loss weights (scale importance)
  loss_weights: [0.5, 0.2, 0.15, 0.1, 0.05]
  # Asymmetric weights for each scale: (neg_weight, pos_weight)
  # Progressively more positive bias at coarser scales
  asymmetric_weights:
    - [0.5, 0.5]   # Scale 0 (full res): balanced
    - [0.4, 0.6]   # Scale 1 (patch 2): slight positive bias
    - [0.3, 0.7]   # Scale 2 (patch 4): moderate positive bias
    - [0.2, 0.8]   # Scale 3 (patch 8): strong positive bias
    - [0.1, 0.9]   # Scale 4 (patch 16): very strong positive bias
  early_stopping: true
  es_patience: 50
  save_after: 50

eval:
  batch_size: 16
  threshold: 0.5
  checkpoint: "output/checkpoints/c2seg_best.pth"

logging:
  log_dir: "output/logs"
  checkpoint_dir: "output/checkpoints"
  save_every: 10
