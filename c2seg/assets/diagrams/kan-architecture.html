<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KAN Architecture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: white;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 5px;
      font-size: 24px;
    }
    .subtitle {
      text-align: center;
      color: #7f8c8d;
      margin-bottom: 20px;
      font-size: 12px;
    }
    .diagrams-row {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      flex-wrap: nowrap;
      width: 100%;
      max-width: 1400px;
    }
    .diagram-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    svg { display: block; }
    .block { filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.1)); }
    .input-block { fill: #e8f6f3; stroke: #1abc9c; }
    .base-block { fill: #ebf5fb; stroke: #3498db; }
    .spline-block { fill: #f5eef8; stroke: #9b59b6; }
    .weight-block { fill: #fef9e7; stroke: #f39c12; }
    .output-block { fill: #d5f5e3; stroke: #27ae60; }
    .add-circle { fill: #fadbd8; stroke: #e74c3c; }
    .reshape-block { fill: #fdebd0; stroke: #e67e22; }
    .kan-wrapper { fill: #fff3e0; stroke: #e65100; }
    .arrow { fill: none; stroke: #34495e; stroke-width: 2; marker-end: url(#arrowhead); }
    .label { font-size: 11px; font-weight: 600; fill: #2c3e50; }
    .label-small { font-size: 9px; font-weight: 500; fill: #2c3e50; }
    .dim-label { font-size: 8px; fill: #7f8c8d; font-style: italic; }
    .title-label { font-size: 14px; font-weight: 700; fill: #2c3e50; }
    .formula-box {
      background: #f8f9fa;
      border-radius: 6px;
      padding: 6px 12px;
      margin-top: 10px;
      border-left: 3px solid #3498db;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <h1>KAN: Kolmogorov-Arnold Network</h1>
  <p class="subtitle">Efficient implementation with B-spline basis functions and linear residual path</p>
  
  <div class="diagrams-row">
    
    <!-- KANLinear Diagram -->
    <div class="diagram-box">
      <svg width="320" height="420" viewBox="0 0 320 420">
        <defs>
          <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#34495e"/>
          </marker>
        </defs>
        
        <text x="160" y="18" text-anchor="middle" class="title-label">KANLinear</text>
        
        <rect x="115" y="30" width="90" height="35" rx="5" class="block input-block" stroke-width="2"/>
        <text x="160" y="48" text-anchor="middle" class="label">x</text>
        <text x="160" y="60" text-anchor="middle" class="dim-label">[B, in_features]</text>
        
        <path d="M160,65 L160,80" class="arrow"/>
        <path d="M160,80 L80,105 M160,80 L240,105" stroke="#34495e" stroke-width="2" fill="none"/>
        
        <rect x="25" y="105" width="110" height="35" rx="5" class="block base-block" stroke-width="2"/>
        <text x="80" y="123" text-anchor="middle" class="label">SiLU(x)</text>
        <text x="80" y="135" text-anchor="middle" class="dim-label">base_activation</text>
        
        <path d="M80,140 L80,160" class="arrow"/>
        
        <rect x="25" y="165" width="110" height="45" rx="5" class="block weight-block" stroke-width="2"/>
        <text x="80" y="185" text-anchor="middle" class="label">base_weight</text>
        <text x="80" y="200" text-anchor="middle" class="dim-label">[out, in]</text>
        
        <path d="M80,210 L80,230" class="arrow"/>
        
        <rect x="35" y="235" width="90" height="30" rx="5" class="block base-block" stroke-width="2"/>
        <text x="80" y="254" text-anchor="middle" class="label-small">base_output</text>
        
        <rect x="185" y="105" width="110" height="45" rx="5" class="block spline-block" stroke-width="2"/>
        <text x="240" y="123" text-anchor="middle" class="label">B-splines(x)</text>
        <text x="240" y="138" text-anchor="middle" class="dim-label">grid_size + order</text>
        
        <path d="M240,150 L240,170" class="arrow"/>
        
        <rect x="180" y="175" width="120" height="50" rx="5" class="block weight-block" stroke-width="2"/>
        <text x="240" y="193" text-anchor="middle" class="label">spline_weight</text>
        <text x="240" y="207" text-anchor="middle" class="dim-label">[out, in, G+k]</text>
        <text x="240" y="220" text-anchor="middle" class="dim-label">* spline_scaler</text>
        
        <path d="M240,225 L240,250" class="arrow"/>
        
        <rect x="195" y="235" width="90" height="30" rx="5" class="block spline-block" stroke-width="2"/>
        <text x="240" y="254" text-anchor="middle" class="label-small">spline_output</text>
        
        <path d="M80,265 L80,290 L160,315 M240,265 L240,290 L160,315" stroke="#34495e" stroke-width="2" fill="none"/>
        
        <circle cx="160" cy="325" r="15" class="block add-circle" stroke-width="2"/>
        <text x="160" y="330" text-anchor="middle" class="label" font-size="14">+</text>
        
        <path d="M160,340 L160,360" class="arrow"/>
        
        <rect x="105" y="365" width="110" height="35" rx="5" class="block output-block" stroke-width="2"/>
        <text x="160" y="383" text-anchor="middle" class="label">y</text>
        <text x="160" y="395" text-anchor="middle" class="dim-label">[B, out_features]</text>
      </svg>
      
      <div class="formula-box">y = W_base @ silu(x) + W_spline @ B(x)</div>
    </div>
    
    <!-- KAN (Multi-layer) Diagram -->
    <div class="diagram-box">
      <svg width="240" height="420" viewBox="0 0 240 420">
        <text x="120" y="18" text-anchor="middle" class="title-label">KAN</text>
        
        <rect x="70" y="30" width="100" height="35" rx="5" class="block input-block" stroke-width="2"/>
        <text x="120" y="48" text-anchor="middle" class="label">x</text>
        <text x="120" y="60" text-anchor="middle" class="dim-label">[B, d0]</text>
        
        <path d="M120,65 L120,85" class="arrow"/>
        
        <rect x="40" y="90" width="160" height="50" rx="6" class="block kan-wrapper" stroke-width="2"/>
        <text x="120" y="112" text-anchor="middle" class="label">KANLinear</text>
        <text x="120" y="128" text-anchor="middle" class="dim-label">(d0 -> d1)</text>
        
        <path d="M120,140 L120,160" class="arrow"/>
        
        <rect x="40" y="165" width="160" height="50" rx="6" class="block kan-wrapper" stroke-width="2"/>
        <text x="120" y="187" text-anchor="middle" class="label">KANLinear</text>
        <text x="120" y="203" text-anchor="middle" class="dim-label">(d1 -> d2)</text>
        
        <path d="M120,215 L120,235" class="arrow"/>
        
        <text x="120" y="260" text-anchor="middle" font-size="20" fill="#7f8c8d">...</text>
        
        <path d="M120,275 L120,295" class="arrow"/>
        
        <rect x="40" y="300" width="160" height="50" rx="6" class="block kan-wrapper" stroke-width="2"/>
        <text x="120" y="322" text-anchor="middle" class="label">KANLinear</text>
        <text x="120" y="338" text-anchor="middle" class="dim-label">(d(n-1) -> dn)</text>
        
        <path d="M120,350 L120,370" class="arrow"/>
        
        <rect x="70" y="375" width="100" height="35" rx="5" class="block output-block" stroke-width="2"/>
        <text x="120" y="393" text-anchor="middle" class="label">y</text>
        <text x="120" y="405" text-anchor="middle" class="dim-label">[B, dn]</text>
      </svg>
      
      <div class="formula-box">layers = [d0, d1, ..., dn]</div>
    </div>
    
    <!-- SimpleKANLayer Diagram -->
    <div class="diagram-box">
      <svg width="280" height="420" viewBox="0 0 280 420">
        <text x="140" y="18" text-anchor="middle" class="title-label">SimpleKANLayer</text>
        
        <rect x="80" y="30" width="120" height="40" rx="5" class="block input-block" stroke-width="2"/>
        <text x="140" y="48" text-anchor="middle" class="label">x</text>
        <text x="140" y="62" text-anchor="middle" class="dim-label">[B, N, C]</text>
        
        <path d="M140,70 L140,95" class="arrow"/>
        
        <rect x="60" y="100" width="160" height="35" rx="5" class="block reshape-block" stroke-width="2"/>
        <text x="140" y="118" text-anchor="middle" class="label-small">if x.dim() == 3</text>
        <text x="140" y="130" text-anchor="middle" class="dim-label">handle 3D input</text>
        
        <path d="M140,135 L140,160" class="arrow"/>
        
        <rect x="60" y="165" width="160" height="40" rx="5" class="block reshape-block" stroke-width="2"/>
        <text x="140" y="183" text-anchor="middle" class="label">Reshape</text>
        <text x="140" y="198" text-anchor="middle" class="dim-label">[B*N, C]</text>
        
        <path d="M140,205 L140,230" class="arrow"/>
        
        <rect x="45" y="235" width="190" height="55" rx="6" class="block kan-wrapper" stroke-width="2"/>
        <text x="140" y="257" text-anchor="middle" class="label">KANLinear</text>
        <text x="140" y="273" text-anchor="middle" class="dim-label">(in_dim -> out_dim)</text>
        <text x="140" y="285" text-anchor="middle" class="dim-label">B-spline + base</text>
        
        <path d="M140,290 L140,315" class="arrow"/>
        
        <rect x="60" y="320" width="160" height="40" rx="5" class="block reshape-block" stroke-width="2"/>
        <text x="140" y="338" text-anchor="middle" class="label">Reshape</text>
        <text x="140" y="353" text-anchor="middle" class="dim-label">[B, N, out_dim]</text>
        
        <path d="M140,360 L140,385" class="arrow"/>
        
        <rect x="80" y="390" width="120" height="40" rx="5" class="block output-block" stroke-width="2"/>
        <text x="140" y="408" text-anchor="middle" class="label">y</text>
        <text x="140" y="422" text-anchor="middle" class="dim-label">[B, N, out_dim]</text>
      </svg>
      
      <div class="formula-box">3D wrapper for KANLinear</div>
    </div>
    
  </div>
</body>
</html>
