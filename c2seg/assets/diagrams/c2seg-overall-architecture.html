<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>C2Seg Overall Architecture</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: white;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 5px; font-size: 24px; }
    .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 15px; font-size: 12px; }
    svg { display: block; }
    .block { filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.1)); }
    .input-img { fill: #dbeafe; stroke: #3b82f6; }
    .input-txt { fill: #fce7f3; stroke: #ec4899; }
    .encoder-block { fill: #e0e7ff; stroke: #6366f1; }
    .decoder-block { fill: #d1fae5; stroke: #10b981; }
    .bcam-block { fill: #fef3c7; stroke: #f59e0b; }
    .output-block { fill: #fee2e2; stroke: #ef4444; }
    .clip-block { fill: #f3e8ff; stroke: #a855f7; }
    .arrow-main { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    .arrow-skip { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6,3; marker-end: url(#arrow-gray); }
    .arrow-text { fill: none; stroke: #ec4899; stroke-width: 2; marker-end: url(#arrow-pink); }
    .label { font-size: 13px; font-weight: 600; fill: #1e293b; }
    .dim-label { font-size: 10px; fill: #64748b; }
    .section-label { font-size: 12px; fill: #64748b; font-weight: 600; }
  </style>
</head>
<body>
  <h1>C2Seg: Overall Architecture</h1>
  <p class="subtitle">U-Net with Bidirectional Cross Attention Module (BCAM) for Text-Image Fusion</p>
  
  <svg width="1300" height="850" viewBox="0 0 1300 850">
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#475569"/>
      </marker>
      <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
      </marker>
      <marker id="arrow-pink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#ec4899"/>
      </marker>
    </defs>
    
    <!-- ===== ENCODER COLUMN ===== -->
    <text x="140" y="35" text-anchor="middle" class="section-label">ENCODER</text>
    
    <rect x="30" y="55" width="95" height="55" rx="6" class="block input-img" stroke-width="2"/>
    <text x="77" y="78" text-anchor="middle" class="label">Image</text>
    <text x="77" y="96" text-anchor="middle" class="dim-label">[B,3,224,224]</text>
    
    <rect x="160" y="55" width="95" height="55" rx="6" class="block encoder-block" stroke-width="2"/>
    <text x="207" y="78" text-anchor="middle" class="label">Down0</text>
    <text x="207" y="96" text-anchor="middle" class="dim-label">[64, 224]</text>
    
    <rect x="160" y="160" width="95" height="55" rx="6" class="block encoder-block" stroke-width="2"/>
    <text x="207" y="183" text-anchor="middle" class="label">Down1</text>
    <text x="207" y="201" text-anchor="middle" class="dim-label">[128, 112]</text>
    
    <rect x="160" y="265" width="95" height="55" rx="6" class="block encoder-block" stroke-width="2"/>
    <text x="207" y="288" text-anchor="middle" class="label">Down2</text>
    <text x="207" y="306" text-anchor="middle" class="dim-label">[256, 56]</text>
    
    <rect x="160" y="370" width="95" height="55" rx="6" class="block encoder-block" stroke-width="2"/>
    <text x="207" y="393" text-anchor="middle" class="label">Down3</text>
    <text x="207" y="411" text-anchor="middle" class="dim-label">[512, 28]</text>
    
    <rect x="160" y="475" width="95" height="55" rx="6" class="block encoder-block" stroke-width="2"/>
    <text x="207" y="498" text-anchor="middle" class="label">Down4</text>
    <text x="207" y="516" text-anchor="middle" class="dim-label">[512, 14]</text>
    
    <!-- Encoder flow -->
    <path d="M125,82 L158,82" class="arrow-main"/>
    <path d="M207,110 L207,158" class="arrow-main"/>
    <path d="M207,215 L207,263" class="arrow-main"/>
    <path d="M207,320 L207,368" class="arrow-main"/>
    <path d="M207,425 L207,473" class="arrow-main"/>
    
    <!-- ===== TEXT + CLIP ===== -->
    <rect x="30" y="620" width="95" height="55" rx="6" class="block input-txt" stroke-width="2"/>
    <text x="77" y="643" text-anchor="middle" class="label">Text</text>
    <text x="77" y="661" text-anchor="middle" class="dim-label">"COVID-19..."</text>
    
    <rect x="160" y="620" width="95" height="55" rx="6" class="block clip-block" stroke-width="2"/>
    <text x="207" y="643" text-anchor="middle" class="label">CLIP</text>
    <text x="207" y="661" text-anchor="middle" class="dim-label">(frozen)</text>
    
    <path d="M125,647 L158,647" class="arrow-main"/>
    
    <!-- Text L to all BCAMs - vertical line on right side, branches to each BCAM -->
    <!-- CLIP output goes right, then up along x=880, then branches left into each BCAM right side -->
    <path d="M255,647 L880,647 L880,510 L777,510" class="arrow-text"/>
    <line x1="880" y1="510" x2="880" y2="195" stroke="#ec4899" stroke-width="2"/>
    <path d="M880,405 L777,405" class="arrow-text"/>
    <path d="M880,300 L777,300" class="arrow-text"/>
    <path d="M880,195 L777,195" class="arrow-text"/>
    <text x="885" y="580" text-anchor="start" class="dim-label">L [B,N,512]</text>
    
    <!-- ===== BCAM4: v4 → BCAM4 ===== -->
    <rect x="680" y="475" width="95" height="55" rx="6" class="block bcam-block" stroke-width="2"/>
    <text x="727" y="498" text-anchor="middle" class="label">BCAM4</text>
    <text x="727" y="516" text-anchor="middle" class="dim-label">14x14</text>
    <path d="M255,502 L678,502" class="arrow-main"/>
    
    <!-- ===== Up3: f4 + v3 → Up3 ===== -->
    <rect x="500" y="370" width="95" height="55" rx="6" class="block decoder-block" stroke-width="2"/>
    <text x="547" y="393" text-anchor="middle" class="label">Up3</text>
    <text x="547" y="411" text-anchor="middle" class="dim-label">[256, 28]</text>
    <!-- f4 → Up3: from BCAM4 right side, go right then up then left into Up3 bottom -->
    <path d="M775,502 L820,502 L820,440 L547,440 L547,427" class="arrow-main"/>
    <!-- v3 skip -->
    <path d="M255,397 L498,397" class="arrow-skip"/>
    
    <!-- ===== BCAM3: up3 → BCAM3 ===== -->
    <rect x="680" y="370" width="95" height="55" rx="6" class="block bcam-block" stroke-width="2"/>
    <text x="727" y="393" text-anchor="middle" class="label">BCAM3</text>
    <text x="727" y="411" text-anchor="middle" class="dim-label">28x28</text>
    <path d="M595,397 L678,397" class="arrow-main"/>
    
    <!-- ===== Up2: f3 + v2 → Up2 ===== -->
    <rect x="500" y="265" width="95" height="55" rx="6" class="block decoder-block" stroke-width="2"/>
    <text x="547" y="288" text-anchor="middle" class="label">Up2</text>
    <text x="547" y="306" text-anchor="middle" class="dim-label">[128, 56]</text>
    <!-- f3 → Up2: go right then up then left into Up2 bottom -->
    <path d="M775,397 L820,397 L820,335 L547,335 L547,322" class="arrow-main"/>
    <!-- v2 skip -->
    <path d="M255,292 L498,292" class="arrow-skip"/>
    
    <!-- ===== BCAM2: up2 → BCAM2 ===== -->
    <rect x="680" y="265" width="95" height="55" rx="6" class="block bcam-block" stroke-width="2"/>
    <text x="727" y="288" text-anchor="middle" class="label">BCAM2</text>
    <text x="727" y="306" text-anchor="middle" class="dim-label">56x56</text>
    <path d="M595,292 L678,292" class="arrow-main"/>
    
    <!-- ===== Up1: f2 + v1 → Up1 ===== -->
    <rect x="500" y="160" width="95" height="55" rx="6" class="block decoder-block" stroke-width="2"/>
    <text x="547" y="183" text-anchor="middle" class="label">Up1</text>
    <text x="547" y="201" text-anchor="middle" class="dim-label">[64, 112]</text>
    <!-- f2 → Up1: go right then up then left into Up1 bottom -->
    <path d="M775,292 L835,292 L835,230 L547,230 L547,217" class="arrow-main"/>
    <!-- v1 skip -->
    <path d="M255,187 L498,187" class="arrow-skip"/>
    
    <!-- ===== BCAM1: up1 → BCAM1 ===== -->
    <rect x="680" y="160" width="95" height="55" rx="6" class="block bcam-block" stroke-width="2"/>
    <text x="727" y="183" text-anchor="middle" class="label">BCAM1</text>
    <text x="727" y="201" text-anchor="middle" class="dim-label">112x112</text>
    <path d="M595,187 L678,187" class="arrow-main"/>
    
    <!-- ===== Up0: f1 + v0 → Up0 ===== -->
    <rect x="500" y="55" width="95" height="55" rx="6" class="block decoder-block" stroke-width="2"/>
    <text x="547" y="78" text-anchor="middle" class="label">Up0</text>
    <text x="547" y="96" text-anchor="middle" class="dim-label">[64, 224]</text>
    <!-- f1 → Up0: go right then up then left into Up0 bottom -->
    <path d="M775,187 L850,187 L850,125 L547,125 L547,112" class="arrow-main"/>
    <!-- v0 skip -->
    <path d="M255,82 L498,82" class="arrow-skip"/>
    
    <!-- ===== OUTPUT ===== -->
    <text x="980" y="35" text-anchor="middle" class="section-label">OUTPUT</text>
    
    <rect x="900" y="55" width="95" height="55" rx="6" class="block output-block" stroke-width="2"/>
    <text x="947" y="78" text-anchor="middle" class="label">Conv 1x1</text>
    <text x="947" y="96" text-anchor="middle" class="dim-label">+Sigmoid</text>
    
    <rect x="1040" y="55" width="110" height="55" rx="6" class="block output-block" stroke-width="2"/>
    <text x="1095" y="78" text-anchor="middle" class="label">Mask</text>
    <text x="1095" y="96" text-anchor="middle" class="dim-label">[B,1,224,224]</text>
    
    <path d="M595,82 L898,82" class="arrow-main"/>
    <path d="M995,82 L1038,82" class="arrow-main"/>
    
    <!-- ===== LEGEND ===== -->
    <rect x="900" y="160" width="250" height="290" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="1025" y="192" text-anchor="middle" class="section-label">LEGEND</text>
    
    <rect x="925" y="220" width="26" height="18" rx="3" class="encoder-block" stroke-width="1.5"/>
    <text x="962" y="234" text-anchor="start" class="dim-label">Encoder (DownBlock)</text>
    
    <rect x="925" y="252" width="26" height="18" rx="3" class="decoder-block" stroke-width="1.5"/>
    <text x="962" y="266" text-anchor="start" class="dim-label">Decoder (UpBlock)</text>
    
    <rect x="925" y="284" width="26" height="18" rx="3" class="bcam-block" stroke-width="1.5"/>
    <text x="962" y="298" text-anchor="start" class="dim-label">BCAM (fuses img + text)</text>
    
    <rect x="925" y="316" width="26" height="18" rx="3" class="clip-block" stroke-width="1.5"/>
    <text x="962" y="330" text-anchor="start" class="dim-label">CLIP text encoder</text>
    
    <line x1="925" y1="360" x2="951" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="962" y="364" text-anchor="start" class="dim-label">Feature flow</text>
    
    <line x1="925" y1="392" x2="951" y2="392" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow-gray)"/>
    <text x="962" y="396" text-anchor="start" class="dim-label">Skip connection</text>
    
    <line x1="925" y1="424" x2="951" y2="424" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow-pink)"/>
    <text x="962" y="428" text-anchor="start" class="dim-label">Text L (shared)</text>
    
    <!-- Notes -->
    <text x="550" y="760" text-anchor="middle" font-size="11px" fill="#475569" font-weight="500">Data Flow</text>
    <text x="550" y="790" text-anchor="middle" class="dim-label">Down4 → BCAM4 → Up3(+v3) → BCAM3 → Up2(+v2) → BCAM2 → Up1(+v1) → BCAM1 → Up0(+v0) → Output</text>
    <text x="550" y="820" text-anchor="middle" class="dim-label">Each BCAM fuses decoder output with shared text embedding L from CLIP</text>
  </svg>
</body>
</html>
