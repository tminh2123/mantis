<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C2Seg Overall Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f5;
      font-family: 'Geist', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }
    .container {
      max-width: 1100px;
      width: 100%;
    }
    .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4f5d75;
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2rem;
      font-weight: 400;
      color: #2d3142;
      margin-bottom: 32px;
    }
    .diagram-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    svg {
      display: block;
      min-width: 1050px;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="eyebrow">Medical Image Segmentation</p>
    <h1>C2Seg Overall Architecture</h1>
    <div class="diagram-wrapper">
      <svg viewBox="0 0 1050 680" role="img" aria-labelledby="overall-title overall-desc">
        <title id="overall-title">C2Seg Overall Architecture</title>
        <desc id="overall-desc">End-to-end architecture showing visual encoder, language encoder, BCAM fusion modules, and decoder with deep supervision outputs.</desc>
        
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
          </marker>
        </defs>
        
        <!-- Background -->
        <rect width="1050" height="680" fill="#f5f5f5"/>
        
        <!-- Input Section -->
        <g id="input-section">
          <!-- Image Input -->
          <rect x="40" y="280" width="100" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
          <text x="90" y="312" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Input Image</text>
          <text x="90" y="330" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">[B, 3, 224, 224]</text>
          
          <!-- Text Input -->
          <rect x="40" y="400" width="100" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
          <text x="90" y="432" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Text Prompt</text>
          <text x="90" y="450" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">"infection area"</text>
        </g>
        
        <!-- Visual Encoder -->
        <g id="visual-encoder">
          <rect x="180" y="180" width="160" height="280" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="180" y="180" width="160" height="24" rx="2" fill="#2d3142"/>
          <text x="260" y="196" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" fill="#f5f5f5" letter-spacing="0.1em">VISUAL ENCODER</text>
          
          <!-- Down blocks -->
          <rect x="200" y="220" width="120" height="36" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="260" y="242" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Down0</text>
          
          <rect x="200" y="264" width="120" height="36" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="260" y="286" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Down1</text>
          
          <rect x="200" y="308" width="120" height="36" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="260" y="330" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Down2</text>
          
          <rect x="200" y="352" width="120" height="36" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="260" y="374" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Down3</text>
          
          <rect x="200" y="396" width="120" height="36" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="260" y="418" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Down4</text>
        </g>
        
        <!-- Language Encoder -->
        <g id="language-encoder">
          <rect x="180" y="500" width="160" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="180" y="500" width="160" height="24" rx="2" fill="#2d3142"/>
          <text x="260" y="516" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" fill="#f5f5f5" letter-spacing="0.1em">LANGUAGE ENCODER</text>
          
          <rect x="200" y="540" width="120" height="44" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
          <text x="260" y="558" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">CLIP Text</text>
          <text x="260" y="574" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">frozen</text>
        </g>
        
        <!-- BCAM Modules (Focal) -->
        <g id="bcam-modules">
          <rect x="380" y="180" width="140" height="420" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <rect x="380" y="180" width="140" height="24" rx="2" fill="#bf4520"/>
          <text x="450" y="196" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" fill="#f5f5f5" letter-spacing="0.1em">BCAM FUSION</text>
          
          <!-- BCAM blocks -->
          <rect x="400" y="220" width="100" height="80" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="0.8"/>
          <text x="450" y="250" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">BCAM 1</text>
          <text x="450" y="266" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">112×112</text>
          <text x="450" y="282" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#bf4520">+ K-Gate</text>
          
          <rect x="400" y="308" width="100" height="80" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="0.8"/>
          <text x="450" y="338" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">BCAM 2</text>
          <text x="450" y="354" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">56×56</text>
          <text x="450" y="370" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#bf4520">+ K-Gate</text>
          
          <rect x="400" y="396" width="100" height="80" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="0.8"/>
          <text x="450" y="426" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">BCAM 3</text>
          <text x="450" y="442" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">28×28</text>
          <text x="450" y="458" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#bf4520">+ K-Gate</text>
          
          <rect x="400" y="484" width="100" height="80" rx="4" fill="#ffffff" stroke="#bf4520" stroke-width="0.8"/>
          <text x="450" y="514" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">BCAM 4</text>
          <text x="450" y="530" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">14×14</text>
          <text x="450" y="546" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#bf4520">+ K-Gate</text>
        </g>
        
        <!-- Decoder -->
        <g id="decoder">
          <rect x="560" y="180" width="160" height="280" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="560" y="180" width="160" height="24" rx="2" fill="#2d3142"/>
          <text x="640" y="196" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" fill="#f5f5f5" letter-spacing="0.1em">DECODER</text>
          
          <!-- Up blocks -->
          <rect x="580" y="220" width="120" height="44" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="640" y="238" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Up3</text>
          <text x="640" y="254" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">+ PixLevelModule</text>
          
          <rect x="580" y="272" width="120" height="44" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="640" y="290" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Up2</text>
          <text x="640" y="306" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">+ PixLevelModule</text>
          
          <rect x="580" y="324" width="120" height="44" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="640" y="342" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Up1</text>
          <text x="640" y="358" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">+ PixLevelModule</text>
          
          <rect x="580" y="376" width="120" height="44" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="640" y="394" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Up0</text>
          <text x="640" y="410" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">+ PixLevelModule</text>
        </g>
        
        <!-- Deep Supervision Outputs -->
        <g id="deep-supervision">
          <rect x="760" y="180" width="120" height="280" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
          <rect x="760" y="180" width="120" height="24" rx="2" fill="#4f5d75"/>
          <text x="820" y="196" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" fill="#f5f5f5" letter-spacing="0.1em">DEEP SUPERVISION</text>
          
          <rect x="775" y="220" width="90" height="36" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="820" y="238" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">out4</text>
          <text x="820" y="250" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">14×14</text>
          
          <rect x="775" y="264" width="90" height="36" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="820" y="282" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">out3</text>
          <text x="820" y="294" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">28×28</text>
          
          <rect x="775" y="308" width="90" height="36" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="820" y="326" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">out2</text>
          <text x="820" y="338" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">56×56</text>
          
          <rect x="775" y="352" width="90" height="36" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
          <text x="820" y="370" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">out1</text>
          <text x="820" y="382" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">112×112</text>
          
          <rect x="775" y="396" width="90" height="44" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
          <text x="820" y="414" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">out0</text>
          <text x="820" y="426" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#bf4520">224×224</text>
        </g>
        
        <!-- Final Output -->
        <g id="output">
          <rect x="920" y="310" width="100" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <text x="970" y="342" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Segmentation</text>
          <text x="970" y="358" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#2d3142">Mask</text>
          <text x="970" y="378" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#bf4520">[B, 1, 224, 224]</text>
        </g>
        
        <!-- Arrows -->
        <!-- Input to Encoder -->
        <line x1="140" y1="320" x2="176" y2="320" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="140" y1="440" x2="156" y2="440" stroke="#4f5d75" stroke-width="1"/>
        <line x1="156" y1="440" x2="156" y2="550" stroke="#4f5d75" stroke-width="1"/>
        <line x1="156" y1="550" x2="176" y2="550" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        
        <!-- Encoder to BCAM -->
        <line x1="320" y1="282" x2="396" y2="260" stroke="#bf4520" stroke-width="1" marker-end="url(#arrow-accent)"/>
        <line x1="320" y1="326" x2="396" y2="348" stroke="#bf4520" stroke-width="1" marker-end="url(#arrow-accent)"/>
        <line x1="320" y1="370" x2="396" y2="436" stroke="#bf4520" stroke-width="1" marker-end="url(#arrow-accent)"/>
        <line x1="320" y1="414" x2="396" y2="524" stroke="#bf4520" stroke-width="1" marker-end="url(#arrow-accent)"/>
        
        <!-- Language to BCAM -->
        <line x1="340" y1="550" x2="340" y2="610" stroke="#bf4520" stroke-width="1"/>
        <line x1="340" y1="610" x2="450" y2="610" stroke="#bf4520" stroke-width="1"/>
        <line x1="450" y1="610" x2="450" y2="568" stroke="#bf4520" stroke-width="1" marker-end="url(#arrow-accent)"/>
        
        <!-- BCAM to Decoder -->
        <line x1="500" y1="260" x2="556" y2="242" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="500" y1="348" x2="556" y2="294" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="500" y1="436" x2="556" y2="346" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="500" y1="524" x2="556" y2="398" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        
        <!-- Decoder to Deep Supervision -->
        <line x1="700" y1="242" x2="756" y2="238" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <line x1="700" y1="294" x2="756" y2="282" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <line x1="700" y1="346" x2="756" y2="326" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <line x1="700" y1="398" x2="756" y2="370" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        
        <!-- Main output path -->
        <line x1="720" y1="398" x2="740" y2="398" stroke="#bf4520" stroke-width="1.2"/>
        <line x1="740" y1="398" x2="740" y2="418" stroke="#bf4520" stroke-width="1.2"/>
        <line x1="740" y1="418" x2="771" y2="418" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        
        <!-- To final output -->
        <line x1="865" y1="418" x2="890" y2="418" stroke="#bf4520" stroke-width="1.2"/>
        <line x1="890" y1="418" x2="890" y2="350" stroke="#bf4520" stroke-width="1.2"/>
        <line x1="890" y1="350" x2="916" y2="350" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        
        <!-- Skip connections (dashed) -->
        <line x1="260" y1="460" x2="260" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="260" y1="480" x2="556" y2="480" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="556" y1="480" x2="556" y2="460" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        
        <!-- Legend -->
        <g transform="translate(40, 640)">
          <rect x="0" y="0" width="970" height="32" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
          
          <rect x="20" y="10" width="12" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
          <text x="40" y="20" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">FOCAL / OUTPUT</text>
          
          <rect x="160" y="10" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="180" y="20" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">ENCODER / DECODER</text>
          
          <rect x="340" y="10" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8" stroke-dasharray="4,3"/>
          <text x="360" y="20" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">OPTIONAL (DEEP SUP)</text>
          
          <line x1="520" y1="16" x2="550" y2="16" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
          <text x="560" y="20" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">CROSS-MODAL FUSION</text>
          
          <line x1="720" y1="16" x2="750" y2="16" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
          <text x="760" y="20" font-family="'Geist Mono', monospace" font-size="9" fill="#5a6580">SKIP / AUXILIARY</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
