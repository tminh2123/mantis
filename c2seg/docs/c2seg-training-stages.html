<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C2Seg Training Stages</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f5f5f5;
      font-family: 'Geist', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }
    .container {
      max-width: 1200px;
      width: 100%;
    }
    .eyebrow {
      font-family: 'Geist Mono', ui-monospace, monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4f5d75;
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 2rem;
      font-weight: 400;
      color: #2d3142;
      margin-bottom: 32px;
    }
    .diagram-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    svg {
      display: block;
      min-width: 1150px;
    }
  </style>
</head>
<body>
  <div class="container">
    <p class="eyebrow">Training Pipeline</p>
    <h1>C2Seg Two-Stage Training Process</h1>
    <div class="diagram-wrapper">
      <svg viewBox="0 0 1150 750" role="img" aria-labelledby="training-title training-desc">
        <title id="training-title">C2Seg Training Stages</title>
        <desc id="training-desc">Two-stage training pipeline showing Stage I CaCL pretraining for cross-modal alignment and Stage II segmentation fine-tuning with deep supervision.</desc>
        
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto" markerUnits="strokeWidth">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf4520"/>
          </marker>
        </defs>
        
        <!-- Background -->
        <rect width="1150" height="750" fill="#f5f5f5"/>
        
        <!-- Stage I: CaCL Pretraining -->
        <g id="stage-1">
          <rect x="40" y="40" width="520" height="320" rx="8" fill="rgba(46,90,168,0.04)" stroke="rgba(46,90,168,0.25)" stroke-width="1.2"/>
          <rect x="40" y="40" width="520" height="32" rx="8" fill="#2e5aa8"/>
          <text x="300" y="62" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#f5f5f5" letter-spacing="0.15em">STAGE I: CaCL PRETRAINING</text>
          
          <!-- Objective -->
          <text x="60" y="95" font-family="'Instrument Serif', serif" font-size="16" fill="#2d3142">Cross-Modal Alignment via Contrastive Learning</text>
          
          <!-- Input data -->
          <g transform="translate(60, 115)">
            <rect x="0" y="0" width="140" height="80" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="0.8"/>
            <text x="70" y="25" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Training Data</text>
            <text x="70" y="45" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">Image + Text pairs</text>
            <text x="70" y="60" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">No mask required</text>
            <text x="70" y="75" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#2e5aa8">batch_size: 256</text>
          </g>
          
          <!-- Visual Encoder -->
          <g transform="translate(230, 115)">
            <rect x="0" y="0" width="100" height="80" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
            <text x="50" y="25" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">Visual Encoder</text>
            <text x="50" y="45" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">Down0→Down4</text>
            <text x="50" y="60" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#2e5aa8">trainable</text>
            <text x="50" y="75" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">+ img_proj</text>
          </g>
          
          <!-- Language Encoder -->
          <g transform="translate(360, 115)">
            <rect x="0" y="0" width="100" height="80" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
            <text x="50" y="25" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">CLIP Text</text>
            <text x="50" y="45" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">ViT-B/32</text>
            <text x="50" y="60" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#bf4520">frozen</text>
            <text x="50" y="75" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">+ text_proj</text>
          </g>
          
          <!-- Contrastive Loss -->
          <g transform="translate(230, 215)">
            <rect x="0" y="0" width="230" height="90" rx="4" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1"/>
            <text x="115" y="20" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">CaCL Loss</text>
            <text x="115" y="38" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">Cluster-aware Contrastive Learning</text>
            
            <text x="20" y="56" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">• τ = 0.07 (temperature)</text>
            <text x="20" y="70" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">• ε = 0.8 (soft-label mixing)</text>
            <text x="20" y="84" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">• Debias text similarity matrix</text>
          </g>
          
          <!-- Arrows -->
          <line x1="200" y1="155" x2="226" y2="155" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
          <line x1="280" y1="195" x2="280" y2="211" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
          <line x1="410" y1="195" x2="410" y2="211" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
          
          <!-- Config box -->
          <g transform="translate(60, 215)">
            <rect x="0" y="0" width="140" height="90" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
            <text x="70" y="20" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" fill="#4f5d75" letter-spacing="0.08em">HYPERPARAMETERS</text>
            <text x="15" y="40" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">epochs: 30</text>
            <text x="15" y="54" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">lr: 1e-4</text>
            <text x="15" y="68" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">weight_decay: 1e-4</text>
            <text x="15" y="82" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">scheduler: CosineAnnealing</text>
          </g>
          
          <!-- Output -->
          <rect x="480" y="235" width="60" height="50" rx="4" fill="rgba(46,90,168,0.08)" stroke="#2e5aa8" stroke-width="1"/>
          <text x="510" y="255" text-anchor="middle" font-family="'Geist', sans-serif" font-size="9" font-weight="600" fill="#2d3142">Aligned</text>
          <text x="510" y="270" text-anchor="middle" font-family="'Geist', sans-serif" font-size="9" font-weight="600" fill="#2d3142">V & L</text>
          
          <line x1="460" y1="260" x2="476" y2="260" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow)"/>
        </g>
        
        <!-- Stage Transition Arrow -->
        <g id="transition">
          <line x1="575" y1="200" x2="595" y2="200" stroke="#bf4520" stroke-width="2"/>
          <line x1="595" y1="200" x2="595" y2="80" stroke="#bf4520" stroke-width="2"/>
          <line x1="595" y1="80" x2="615" y2="80" stroke="#bf4520" stroke-width="2" marker-end="url(#arrow-accent)"/>
          
          <rect x="575" y="120" width="100" height="40" rx="4" fill="#f5f5f5" stroke="#bf4520" stroke-width="1"/>
          <text x="625" y="138" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#bf4520">Load weights</text>
          <text x="625" y="152" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">pretrain_best.pth</text>
        </g>
        
        <!-- Stage II: Segmentation Fine-tuning -->
        <g id="stage-2">
          <rect x="590" y="40" width="520" height="320" rx="8" fill="rgba(191,69,32,0.04)" stroke="rgba(191,69,32,0.25)" stroke-width="1.2"/>
          <rect x="590" y="40" width="520" height="32" rx="8" fill="#bf4520"/>
          <text x="850" y="62" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="11" font-weight="600" fill="#f5f5f5" letter-spacing="0.15em">STAGE II: SEGMENTATION FINE-TUNING</text>
          
          <!-- Objective -->
          <text x="610" y="95" font-family="'Instrument Serif', serif" font-size="16" fill="#2d3142">Pixel-level Segmentation with Deep Supervision</text>
          
          <!-- Input data -->
          <g transform="translate(610, 115)">
            <rect x="0" y="0" width="140" height="80" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="0.8"/>
            <text x="70" y="25" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Training Data</text>
            <text x="70" y="45" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">Image + Text + Mask</text>
            <text x="70" y="60" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#bf4520">GT masks required</text>
            <text x="70" y="75" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#bf4520">batch_size: 16-64</text>
          </g>
          
          <!-- Full Model -->
          <g transform="translate(780, 115)">
            <rect x="0" y="0" width="210" height="80" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
            <text x="105" y="20" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">Full C2Seg Model</text>
            <text x="105" y="40" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">Encoder + BCAM + Decoder</text>
            <text x="105" y="56" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#bf4520">all trainable</text>
            <text x="105" y="72" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">visual_enc: lr×0.1</text>
          </g>
          
          <!-- Deep Supervision Loss -->
          <g transform="translate(610, 215)">
            <rect x="0" y="0" width="380" height="90" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
            <text x="190" y="20" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" fill="#2d3142">Deep Supervision Loss</text>
            
            <!-- Scale indicators -->
            <g transform="translate(15, 35)">
              <rect x="0" y="0" width="65" height="45" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="0.5"/>
              <text x="32" y="14" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">out0: λ=0.50</text>
              <text x="32" y="26" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#5a6580">224×224</text>
              <text x="32" y="38" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#bf4520">w=[0.5,0.5]</text>
            </g>
            
            <g transform="translate(88, 35)">
              <rect x="0" y="0" width="65" height="45" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="0.5"/>
              <text x="32" y="14" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">out1: λ=0.20</text>
              <text x="32" y="26" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#5a6580">112×112</text>
              <text x="32" y="38" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#bf4520">w=[0.4,0.6]</text>
            </g>
            
            <g transform="translate(161, 35)">
              <rect x="0" y="0" width="65" height="45" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="0.5"/>
              <text x="32" y="14" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">out2: λ=0.15</text>
              <text x="32" y="26" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#5a6580">56×56</text>
              <text x="32" y="38" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#bf4520">w=[0.3,0.7]</text>
            </g>
            
            <g transform="translate(234, 35)">
              <rect x="0" y="0" width="65" height="45" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="0.5"/>
              <text x="32" y="14" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">out3: λ=0.10</text>
              <text x="32" y="26" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#5a6580">28×28</text>
              <text x="32" y="38" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#bf4520">w=[0.2,0.8]</text>
            </g>
            
            <g transform="translate(307, 35)">
              <rect x="0" y="0" width="60" height="45" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="0.5"/>
              <text x="30" y="14" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">out4: λ=0.05</text>
              <text x="30" y="26" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#5a6580">14×14</text>
              <text x="30" y="38" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#bf4520">w=[0.1,0.9]</text>
            </g>
          </g>
          
          <!-- Config box -->
          <g transform="translate(1000, 215)">
            <rect x="0" y="0" width="100" height="90" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="0.8"/>
            <text x="50" y="16" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" font-weight="500" fill="#4f5d75" letter-spacing="0.08em">HYPERPARAMS</text>
            <text x="10" y="34" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">epochs: 500</text>
            <text x="10" y="48" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">lr: 1e-4</text>
            <text x="10" y="62" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">es_patience: 50</text>
            <text x="10" y="76" font-family="'Geist Mono', monospace" font-size="8" fill="#2d3142">accum_steps: 2-4</text>
          </g>
          
          <!-- Arrows -->
          <line x1="750" y1="155" x2="776" y2="155" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
          <line x1="885" y1="195" x2="885" y2="211" stroke="#bf4520" stroke-width="1" marker-end="url(#arrow-accent)"/>
        </g>
        
        <!-- Data Flow Diagram -->
        <g id="data-flow">
          <rect x="40" y="400" width="1070" height="300" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
          <text x="60" y="430" font-family="'Geist Mono', monospace" font-size="10" font-weight="500" fill="#4f5d75" letter-spacing="0.12em">DATA FLOW: FORWARD PASS</text>
          <text x="60" y="450" font-family="'Instrument Serif', serif" font-size="16" fill="#2d3142">Complete Training Pipeline</text>
          
          <!-- Input -->
          <g transform="translate(60, 480)">
            <rect x="0" y="0" width="100" height="70" rx="4" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="0.8"/>
            <text x="50" y="20" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">Input</text>
            <text x="50" y="38" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">Image: [B,3,224,224]</text>
            <text x="50" y="52" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">Text: list[str]</text>
            <text x="50" y="66" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">Mask: [B,1,224,224]</text>
          </g>
          
          <!-- Visual Encoder -->
          <g transform="translate(190, 480)">
            <rect x="0" y="0" width="120" height="70" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
            <text x="60" y="20" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">Visual Encoder</text>
            <text x="60" y="38" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">v0: [B,C,224,224]</text>
            <text x="60" y="52" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">...</text>
            <text x="60" y="66" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">v4: [B,8C,14,14]</text>
          </g>
          
          <!-- Language Encoder -->
          <g transform="translate(190, 570)">
            <rect x="0" y="0" width="120" height="50" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
            <text x="60" y="20" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">CLIP Text</text>
            <text x="60" y="38" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">l: [B,N,512]</text>
          </g>
          
          <!-- Text Masking -->
          <g transform="translate(340, 570)">
            <rect x="0" y="0" width="80" height="50" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
            <text x="40" y="20" text-anchor="middle" font-family="'Geist', sans-serif" font-size="9" font-weight="600" fill="#2d3142">Text Mask</text>
            <text x="40" y="36" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#5a6580">rate: 0.3</text>
          </g>
          
          <!-- Image Masking -->
          <g transform="translate(340, 500)">
            <rect x="0" y="0" width="80" height="50" rx="4" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
            <text x="40" y="20" text-anchor="middle" font-family="'Geist', sans-serif" font-size="9" font-weight="600" fill="#2d3142">Img Mask</text>
            <text x="40" y="36" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#5a6580">rate: 0.3</text>
          </g>
          
          <!-- BCAM Fusion -->
          <g transform="translate(450, 480)">
            <rect x="0" y="0" width="140" height="140" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
            <text x="70" y="20" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">BCAM × 4</text>
            <text x="70" y="40" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">Cross Attention</text>
            <text x="70" y="56" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#bf4520">+ K-Gate (KAN)</text>
            
            <rect x="20" y="70" width="100" height="55" rx="2" fill="#ffffff" stroke="#bf4520" stroke-width="0.5"/>
            <text x="70" y="88" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">fuse4: v4 + l</text>
            <text x="70" y="100" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">fuse3: up3 + l</text>
            <text x="70" y="112" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">fuse2: up2 + l</text>
            <text x="70" y="124" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">fuse1: up1 + l</text>
          </g>
          
          <!-- Decoder -->
          <g transform="translate(620, 480)">
            <rect x="0" y="0" width="120" height="140" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
            <text x="60" y="20" text-anchor="middle" font-family="'Geist', sans-serif" font-size="10" font-weight="600" fill="#2d3142">Decoder</text>
            <text x="60" y="40" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#5a6580">UpBlock + PixLevel</text>
            
            <rect x="15" y="55" width="90" height="75" rx="2" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="0.5"/>
            <text x="60" y="70" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">up3: 28×28</text>
            <text x="60" y="85" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">up2: 56×56</text>
            <text x="60" y="100" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" fill="#2d3142">up1: 112×112</text>
